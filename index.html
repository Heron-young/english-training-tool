<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heron · 英语训练平台</title>
<style>
:root{
  --ink:#141820;
  --sub:#6d737d;
  --sub2:#8b929b;
  --bg1:#fbfbff;
  --bg2:#eef5ff;
  --bg3:#dbeaff;
  --edge:rgba(255,255,255,.72);
  --line:rgba(110,125,150,.14);
  --glass:rgba(255,255,255,.40);
  --glass2:rgba(255,255,255,.26);
  --blue:#86b3d9;
  --blue2:#bcd6ee;
  --shadow:0 18px 46px rgba(82,108,144,.11), inset 0 1px 0 rgba(255,255,255,.72);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 16% 0%,rgba(255,255,255,.94),transparent 32%),
    radial-gradient(circle at 88% 28%,rgba(232,238,255,.85),transparent 38%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 52%,var(--bg3));
  background-attachment:fixed;
}
button,input,textarea{font:inherit}
button{border:0;cursor:pointer}
.top{
  position:sticky;top:0;z-index:50;
  padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
  background:rgba(252,252,255,.62);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
  border-bottom:1px solid rgba(255,255,255,.60);
}
.header{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;max-width:900px;margin:0 auto}
.logo{width:46px;height:46px;border-radius:16px;background:url("data:image/jpeg;base64,") center/cover,linear-gradient(145deg,#f2f2f2,#d9dde3);overflow:hidden}
.title h1{margin:0;font-size:23px;line-height:1.12;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{margin:3px 0 0;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exit{color:var(--sub);background:transparent;font-size:15px}
main{max-width:900px;margin:0 auto;padding:22px 20px 36px}
.page{display:none}
.page.active{display:block}
h2{font-size:32px;line-height:1.08;margin:0 0 8px;letter-spacing:-.05em}
h3{font-size:19px;line-height:1.18;margin:0 0 8px;letter-spacing:-.03em}
.sub{color:var(--sub);font-size:16px;line-height:1.45;margin:0 0 18px}
.small,.meta{color:var(--sub);font-size:13px;line-height:1.45}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-size:16px;margin:4px 0 18px;cursor:pointer}
.card,.panel,.round-card,.metric,.entry,.inputbox{
  border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,255,255,.24));
  border:1px solid var(--edge);
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(145%);
  -webkit-backdrop-filter:blur(24px) saturate(145%);
}
.panel{padding:22px;margin-top:18px}
.home-panel{padding:22px;border-radius:34px}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.metric{min-height:88px;padding:16px;text-align:left;color:var(--ink)}
.metric b{display:block;font-size:34px;line-height:1;letter-spacing:-.05em}
.metric span{display:block;color:var(--sub);margin-top:10px;font-size:13px}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(120,135,160,.18),transparent);margin:18px 0}
.entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.entry{min-height:76px;padding:15px;text-align:left;color:var(--ink)}
.entry strong{display:block;font-size:18px}
.entry span{display:block;color:var(--sub);font-size:12.5px;margin-top:6px}
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.pill,.status-btn,.tag-btn{
  border-radius:999px;padding:9px 13px;
  color:rgba(50,58,70,.68);
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.68);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
}
.pill.active,.status-btn.active,.tag-btn.active{background:linear-gradient(145deg,rgba(135,181,218,.52),rgba(255,255,255,.38));color:#315f75;font-weight:800}
.primary{
  color:white;background:linear-gradient(145deg,#98c5e8,#6fa4cc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 30px rgba(86,135,176,.23);
  border-radius:999px;padding:12px 18px;font-weight:700;
}
.ghost{background:rgba(255,255,255,.38);color:var(--ink);border-radius:999px;padding:10px 15px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.round-card{padding:18px 20px;margin:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
.round-card h3{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px}
.round-card .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{border-radius:999px;padding:5px 10px;background:rgba(120,128,140,.13);color:var(--sub);font-size:12px}
.delete-btn{width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.44);color:rgba(45,52,62,.56);font-size:20px}
input,textarea,.editor{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  border-radius:22px;
  background:rgba(255,255,255,.42);
  padding:14px 15px;
  color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.50);
}
textarea{min-height:160px;resize:vertical;line-height:1.55}
label{display:block;margin:16px 0 8px;font-weight:750}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.empty{padding:24px;text-align:center;color:var(--sub);border-radius:26px;background:rgba(255,255,255,.24);border:1px dashed rgba(120,130,150,.25)}
.notice{padding:14px;border-radius:18px;background:rgba(255,249,232,.52);color:#8a5a19}
.qnums{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:4px}
.qnums button{flex:0 0 auto;width:38px;height:38px;border-radius:14px;background:rgba(255,255,255,.48);color:#9a8064}
.qnums button.active{background:linear-gradient(145deg,#a7c9e7,#78aad2);color:white;font-weight:800}
.qnums button.answered{color:#315f75}
.answer-card{padding:22px;text-align:center}
.answer-meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;color:var(--sub);font-size:13px}
.question-title{font-size:25px;font-weight:850;line-height:1.25;margin:18px auto 14px;max-width:720px}
.hint details,.review details,details.ref{margin:10px 0}
details summary{cursor:pointer;color:rgba(85,92,102,.62);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"›";margin-right:6px}
details[open] summary::before{content:"⌄"}
.info-table{margin:10px auto;max-width:560px;display:grid;gap:6px;text-align:left}
.info-row{display:grid;grid-template-columns:86px 1fr;gap:12px;color:var(--sub);font-size:14px}
.info-row b{color:#5b6370}
.editor{min-height:118px;text-align:left;font-size:18px;line-height:1.55}
.editor:empty:before{content:attr(data-placeholder);color:rgba(90,96,106,.28)}
.self-editor{min-height:62px;font-size:15px}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.ref-content{margin:12px auto 0;max-width:620px;color:#4f5967;line-height:1.55}
.bottom-nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.bottom-nav button{min-width:120px}
.type-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.type-card{padding:16px;text-align:left;color:var(--ink)}
.type-card b{font-size:26px}
.type-card span{display:block;color:var(--sub);margin-top:5px}
.type-detail{padding:18px;margin:10px 0}
.type-detail summary{display:flex;justify-content:space-between;align-items:center}
.type-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.type-list li{padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.28);cursor:pointer}
.export-text{white-space:pre-wrap;text-align:left;max-height:420px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}
@media(max-width:720px){
  main{padding:20px 20px 32px}
  .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{min-height:78px}
  .metric b{font-size:31px}
  .entry-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .round-card h3{font-size:21px}
  .question-title{font-size:24px}
}
</style>
</head>
<body>
<div class="top">
  <div class="header">
    <div class="logo" onclick="showPage('home')"></div>
    <div class="title" onclick="showPage('home')">
      <h1>Heron · 英语训练平台</h1>
      <p>English training platform</p>
    </div>
    <button class="exit" onclick="location.reload()">退出</button>
  </div>
</div>

<main>
<section id="home" class="page active">
  <div id="homeStats"></div>
</section>

<section id="rounds" class="page">
  <div class="back" onclick="showPage('home')">← 返回首页</div>
  <div class="page-head">
    <div><h2>训练轮次</h2><p class="sub">选择一个轮次开始作答。</p></div>
    <button class="primary" onclick="showPage('newRound')">+ 新建</button>
  </div>
  <div id="roundList"></div>
</section>

<section id="newRound" class="page">
  <div class="back" onclick="showPage('home')">← 返回首页</div>
  <h2>新建轮次</h2>
  <p class="sub">粘贴 HEQ1 出题包，或使用兼容格式。</p>
  <div class="panel">
    <label>轮次标题</label>
    <input id="newTitle" placeholder="例：正式训练第7轮｜句型训练">
    <label>题目文本</label>
    <textarea id="newText" placeholder="HEQ1&#10;1|题目|参考答案|类型|阶段|句型骨架|句型限制|备注|音标"></textarea>
    <div class="actions">
      <button class="ghost" onclick="previewCreate()">预览识别</button>
      <button id="createBtn" class="primary" onclick="createRound()" disabled>创建轮次</button>
    </div>
    <div id="createPreview"></div>
  </div>
</section>

<section id="typeGroups" class="page">
  <div class="back" onclick="showPage('home')">← 返回首页</div>
  <h2>题型分组</h2>
  <p class="sub">只做查看与筛选，不生成题目，不替代 Notion 错题库。</p>
  <div id="typeGroupBox"></div>
</section>

<section id="guide" class="page">
  <div class="back" onclick="showPage('home')">← 返回首页</div>
  <h2>流转 / 说明</h2>
  <p class="sub">待二筛、备份、规则集中在这里。</p>
  <details class="panel" open>
    <summary><h3>待 AI 二筛</h3></summary>
    <div id="guidePendingList"></div>
  </details>
  <details class="panel">
    <summary><h3>设备备份</h3></summary>
    <p class="sub">建议使用 .heb 文件在设备之间流转。</p>
    <div class="actions">
      <button class="primary" onclick="downloadHEB()">下载 .heb 备份</button>
      <button class="ghost" onclick="document.getElementById('fileIn').click()">导入 .heb / JSON</button>
      <input id="fileIn" type="file" accept=".heb,.json,.txt,text/plain,application/json" style="display:none" onchange="importFile(this.files&&this.files[0])">
      <button class="ghost" onclick="downloadJSON()">下载 JSON</button>
    </div>
    <label>应急文本导入</label>
    <textarea id="backupText" placeholder="粘贴 HEB1E / JSON"></textarea>
    <div class="actions"><button class="ghost" onclick="importBackupText()">导入文本</button><button class="ghost" onclick="copyBackupText()">复制 JSON</button></div>
  </details>
  <details class="panel">
    <summary><h3>当前规则</h3></summary>
    <p class="sub">本地工具只负责承载、作答、保存、导出。英语助手负责出题与二筛，Notion 负责沉淀。</p>
  </details>
</section>

<section id="detail" class="page">
  <div class="back" onclick="showPage('rounds')">← 返回列表</div>
  <div id="detailBox"></div>
</section>

<section id="exportPage" class="page">
  <div class="back" onclick="openRound(currentRoundId)">← 返回轮次</div>
  <div id="exportBox"></div>
</section>
</main>

<script>
const KEY="heron_english_rounds_v04";
let state={rounds:[]};
let currentRoundId=null;
let currentIndex=0;
let roundStatusFilter="all";
let pendingQuestions=[];
let pendingMeta={};
let softTimer=null;

const ERROR_TAGS=["语序","时态","介词","冠词","be动词","主谓一致","句型骨架","单词拼写","表达不自然","未掌握","阶段可通过"];
const STATUS_OPTIONS=[["answering","作答中"],["pending_ai","待 AI 二筛"],["reviewed","Heron 已审核"],["notion_done","已沉淀 Notion"]];

function now(){return new Date().toISOString()}
function uid(p){return p+"_"+Date.now().toString().slice(3)+"-"+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function fmtDate(v){if(!v)return"";try{const d=new Date(v);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}catch(e){return String(v)}}
function normalizeStatus(s){if(s==="done")return"notion_done";if(s==="first_screen")return"answering";return s||"answering"}
function statusLabel(s){s=normalizeStatus(s);return Object.fromEntries(STATUS_OPTIONS)[s]||"作答中"}
function statusClass(s){return "st-"+normalizeStatus(s)}
function typeCodeToName(s){s=String(s||"").trim();return {ce:"中译英",ec:"英译中",sp:"拆分",od:"连词成句",rw:"改写",wr:"小作文"}[s]||s||"中译英"}

function normalizeQuestion(q){
  q=q||{};
  return {
    id:q.id||uid("q"),
    prompt:q.prompt||q.question||q.title||q.text||q.q||"",
    reference:q.reference||q.answer||q.referenceAnswer||q.ref||"",
    type:typeCodeToName(q.type||q.kind||"中译英"),
    stage:q.stage||"",
    pattern:q.pattern||q.skeleton||q.bone||"",
    constraint:q.constraint||q.limit||"",
    note:q.note||q.remark||"",
    phonetic:q.phonetic||q.ipa||"",
    userAnswer:q.userAnswer||q.heronAnswer||q.user||"",
    selfCheck:q.selfCheck||q.self||q.firstCheck||"",
    errorTags:Array.isArray(q.errorTags)?q.errorTags:[]
  }
}
function normalizeRound(r){
  r=r||{};
  return {
    id:r.id||uid("tr"),
    title:r.title||r.name||"未命名训练轮次",
    createdAt:r.createdAt||now(),
    updatedAt:r.updatedAt||r.createdAt||now(),
    submittedAt:r.submittedAt||null,
    status:normalizeStatus(r.status),
    questions:Array.isArray(r.questions)?r.questions.map(normalizeQuestion):[]
  }
}
function normalizeState(){
  if(!state||typeof state!=="object")state={rounds:[]};
  if(!Array.isArray(state.rounds))state.rounds=[];
  state.rounds=state.rounds.map(normalizeRound);
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw)state=JSON.parse(raw);
  }catch(e){console.warn(e)}
  normalizeState();
  save();
  showPage("home");
}
function save(){
  normalizeState();
  localStorage.setItem(KEY,JSON.stringify(state));
}
function getRound(id){return state.rounds.find(r=>r.id===id)}
function answeredCount(r){return (r.questions||[]).filter(q=>(q.userAnswer||"").trim()).length}
function totalQuestionCount(){return state.rounds.reduce((n,r)=>n+(r.questions||[]).length,0)}
function totalAnsweredCount(){return state.rounds.reduce((n,r)=>n+answeredCount(r),0)}
function statusCount(){
  const c={all:state.rounds.length,answering:0,pending_ai:0,reviewed:0,notion_done:0};
  state.rounds.forEach(r=>{const s=normalizeStatus(r.status);c[s]=(c[s]||0)+1});
  return c;
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const page=document.getElementById(id);
  if(!page)return;
  page.classList.add("active");
  if(id==="home")renderHome();
  if(id==="rounds")renderRounds();
  if(id==="typeGroups")renderTypeGroups();
  if(id==="guide")renderGuide();
  if(id==="detail")renderDetail();
  window.scrollTo(0,0);
}

function renderHome(){
  const c=statusCount(), tq=totalQuestionCount(), ta=totalAnsweredCount();
  const notion=c.notion_done||0;
  document.getElementById("homeStats").innerHTML=`
    <div class="page-head">
      <div><h2>训练首页</h2><p class="sub">轻量统计 · 状态看板 · 所有入口从这里进入。</p></div>
      <button class="primary" onclick="showPage('newRound')">+ 新建</button>
    </div>
    <section class="panel home-panel">
      <div class="metric-grid">
        <button class="metric" onclick="roundStatusFilter='all';showPage('rounds')"><b>${state.rounds.length}</b><span>总轮次</span></button>
        <button class="metric" onclick="showPage('typeGroups')"><b>${tq}</b><span>总题数</span></button>
        <button class="metric" onclick="roundStatusFilter='all';showPage('rounds')"><b>${ta}</b><span>已作答</span></button>
        <button class="metric" onclick="roundStatusFilter='answering';showPage('rounds')"><b>${c.answering||0}</b><span>作答中</span></button>
        <button class="metric" onclick="roundStatusFilter='pending_ai';showPage('rounds')"><b>${c.pending_ai||0}</b><span>待 AI 二筛</span></button>
        <button class="metric" onclick="roundStatusFilter='notion_done';showPage('rounds')"><b>${notion}</b><span>已沉淀</span></button>
      </div>
      <div class="divider"></div>
      <div class="entry-grid">
        <button class="entry" onclick="roundStatusFilter='all';showPage('rounds')"><strong>训练轮次</strong><span>作答 / 状态流转</span></button>
        <button class="entry" onclick="showPage('newRound')"><strong>新建轮次</strong><span>导入 HEQ1 出题包</span></button>
        <button class="entry" onclick="showPage('typeGroups')"><strong>题型分组</strong><span>按类型查看结构</span></button>
        <button class="entry" onclick="showPage('guide')"><strong>流转 / 说明</strong><span>待二筛 / 备份 / 规则</span></button>
      </div>
      <div class="divider"></div>
      <div class="status-row">${STATUS_OPTIONS.map(([k,l])=>`<button class="pill" onclick="roundStatusFilter='${k}';showPage('rounds')">${l} · ${c[k]||0}</button>`).join("")}<button class="pill" onclick="roundStatusFilter='all';showPage('rounds')">全部 · ${c.all}</button></div>
      <p class="small" style="margin-top:16px">点击数字、状态或入口都可进入对应页面。本地只记录状态，不验证 Notion 是否真实写入。</p>
    </section>`;
}

function renderRounds(){
  const box=document.getElementById("roundList");
  let list=[...state.rounds].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
  if(roundStatusFilter!=="all")list=list.filter(r=>normalizeStatus(r.status)===roundStatusFilter);
  if(!list.length){box.innerHTML=`<div class="empty">暂无${roundStatusFilter==="all"?"":statusLabel(roundStatusFilter)}训练轮次。</div>`;return}
  box.innerHTML=list.map(r=>`
    <div class="round-card" data-id="${esc(r.id)}" onclick="openRound(this.dataset.id)">
      <div>
        <h3>${esc(r.title)}</h3>
        <div class="meta"><span>${r.questions.length} 题</span><span>已作答 ${answeredCount(r)}/${r.questions.length}</span><span>${fmtDate(r.updatedAt)}</span><span class="badge">${statusLabel(r.status)}</span></div>
        <div class="small">ID：${esc(r.id)}</div>
      </div>
      <button class="delete-btn" onclick="event.stopPropagation();deleteRound('${esc(r.id)}')">⌫</button>
    </div>`).join("");
}
function deleteRound(id){
  if(!confirm("确定删除这个训练轮次？"))return;
  state.rounds=state.rounds.filter(r=>r.id!==id);
  save();renderRounds();renderHome();
}
function openRound(id){
  const r=getRound(id);
  if(!r){alert("没有找到这个训练轮次。");showPage("rounds");return}
  currentRoundId=id;
  currentIndex=Math.min(currentIndex,r.questions.length-1);
  if(currentIndex<0)currentIndex=0;
  showPage("detail");
}

function renderDetail(){
  const r=getRound(currentRoundId);
  const box=document.getElementById("detailBox");
  if(!r){box.innerHTML='<div class="empty">没有找到训练轮次。</div>';return}
  if(!r.questions.length){box.innerHTML='<div class="empty">这个轮次没有题目。</div>';return}
  const q=r.questions[currentIndex]||r.questions[0];
  const total=r.questions.length;
  box.innerHTML=`
    <div class="qnums">${r.questions.map((x,i)=>`<button class="${i===currentIndex?'active':(x.userAnswer||"").trim()?'answered':''}" onclick="saveCurrent();currentIndex=${i};renderDetail()">${i+1}</button>`).join("")}</div>
    <div class="answer-card card">
      <div class="answer-meta"><span>第 ${currentIndex+1} / ${total} 题</span><span>${esc(q.type)}</span><span>${esc(q.stage)}</span></div>
      <div class="question-title">${esc(q.prompt)}</div>
      ${renderQuestionHint(q)}
      <label>你的英文作答</label>
      <div id="answerInput" class="editor" contenteditable="true" data-placeholder="在这里输入你的英文答案" oninput="saveCurrentSoft()">${esc(q.userAnswer)}</div>
      ${renderReview(q)}
      <details class="ref"><summary>显示参考答案</summary><div class="ref-content"><b>${esc(q.reference)}</b>${q.phonetic?`<div class="small">${esc(q.phonetic)}</div>`:""}</div></details>
      <div class="bottom-nav">
        <button class="ghost" onclick="prevQ()">‹ 上一题</button>
        ${currentIndex===total-1?`<button class="primary" onclick="finishRound()">提交</button>`:`<button class="primary" onclick="nextQ()">下一题 ›</button>`}
      </div>
    </div>
    <div class="panel">
      <h3>状态流转</h3>
      <div class="status-row">${STATUS_OPTIONS.map(([k,l])=>`<button class="status-btn ${normalizeStatus(r.status)===k?'active':''}" onclick="setRoundStatus('${esc(r.id)}','${k}')">${l}</button>`).join("")}</div>
      <div class="actions"><button class="primary" onclick="showExport()">查看 / 导出 HER1</button><button class="ghost" onclick="showPage('rounds')">返回列表</button></div>
    </div>`;
}
function renderQuestionHint(q){
  const rows=[["类型",q.type],["阶段",q.stage],["句型骨架",q.pattern],["句型限制",q.constraint],["备注",q.note]].filter(x=>(x[1]||"").trim());
  if(!rows.length)return "";
  const preview=q.pattern||q.constraint||q.note||"";
  return `<div class="hint"><details><summary>训练提示 ${preview?`<span class="small">${esc(preview)}</span>`:""}</summary><div class="info-table">${rows.map(([k,v])=>`<div class="info-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></details></div>`
}
function renderReview(q){
  const count=(q.errorTags||[]).length;
  return `<div class="review"><details ${(q.selfCheck||count)?"open":""}><summary>一筛 / 自检（可选） ${count?`<span class="small">错因 ${count}</span>`:""}</summary>
    <div id="selfInput" class="editor self-editor" contenteditable="true" data-placeholder="只记一句：可能错在哪？想确认什么？" oninput="saveCurrentSoft()">${esc(q.selfCheck)}</div>
    <details ${count?"open":""}><summary>Heron 自标错因</summary><div class="tag-row">${ERROR_TAGS.map(t=>`<button class="tag-btn ${q.errorTags.includes(t)?'active':''}" onclick="toggleErrorTag('${esc(t)}')">${esc(t)}</button>`).join("")}</div></details>
  </details></div>`
}
function toggleErrorTag(t){
  saveCurrent();
  const r=getRound(currentRoundId),q=r&&r.questions[currentIndex];if(!q)return;
  q.errorTags=q.errorTags||[];
  const i=q.errorTags.indexOf(t);if(i>=0)q.errorTags.splice(i,1);else q.errorTags.push(t);
  r.updatedAt=now();save();renderDetail();
}
function readEditor(el){return el?(el.innerText||el.textContent||"").replace(/\u00a0/g," ").trim():""}
function saveCurrent(){
  const r=getRound(currentRoundId);if(!r)return;
  const q=r.questions[currentIndex];if(!q)return;
  const a=document.getElementById("answerInput"),s=document.getElementById("selfInput");
  if(a)q.userAnswer=readEditor(a);
  if(s)q.selfCheck=readEditor(s);
  r.updatedAt=now();save();
}
function saveCurrentSoft(){clearTimeout(softTimer);softTimer=setTimeout(saveCurrent,250)}
function nextQ(){saveCurrent();const r=getRound(currentRoundId);if(currentIndex<r.questions.length-1)currentIndex++;renderDetail()}
function prevQ(){saveCurrent();if(currentIndex>0)currentIndex--;renderDetail()}
function finishRound(){
  saveCurrent();
  const r=getRound(currentRoundId);if(!r)return;
  const miss=r.questions.findIndex(q=>!(q.userAnswer||"").trim());
  if(miss>=0){currentIndex=miss;renderDetail();alert(`还有 ${r.questions.filter(q=>!(q.userAnswer||"").trim()).length} 题未作答，已跳到第 ${miss+1} 题。`);return}
  r.status="pending_ai";r.submittedAt=now();r.updatedAt=now();save();showExport();
}
function setRoundStatus(id,status){const r=getRound(id);if(!r)return;r.status=status;r.updatedAt=now();if(status==="pending_ai")r.submittedAt=now();save();renderDetail()}

function parseQuestions(raw){
  raw=String(raw||"").trim();
  pendingMeta={};
  if(!raw)return [];
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const result=[];
  for(const line of lines){
    if(/^HEQ1/i.test(line)||/^题目[|｜]/.test(line))continue;
    let body=line.replace(/^\d+\s*[|｜]/,"");
    let parts=null;
    if(body.includes("||"))parts=body.split("||").map(x=>x.trim());
    else if(body.includes("|"))parts=body.split("|").map(x=>x.trim());
    else continue;
    if(parts.length<2)continue;
    result.push({
      id:uid("q"),
      prompt:parts[0]||"",
      reference:parts[1]||"",
      type:typeCodeToName(parts[2]||"ce"),
      stage:parts[3]||"",
      pattern:parts[4]||"",
      constraint:parts[5]||"",
      note:parts[6]||"",
      phonetic:parts.slice(7).join(" | "),
      userAnswer:"",
      selfCheck:"",
      errorTags:[]
    });
  }
  return result;
}
function previewCreate(){
  pendingQuestions=parseQuestions(document.getElementById("newText").value);
  const box=document.getElementById("createPreview");
  const btn=document.getElementById("createBtn");
  if(!pendingQuestions.length){box.innerHTML='<div class="notice" style="margin-top:14px">没有识别到题目。</div>';btn.disabled=true;return}
  box.innerHTML=`<div class="panel"><h3>识别到 ${pendingQuestions.length} 题</h3>${pendingQuestions.slice(0,8).map((q,i)=>`<p><b>${i+1}. ${esc(q.prompt)}</b><br><span class="small">${esc(q.reference)}</span></p>`).join("")}</div>`;
  btn.disabled=false;
}
function createRound(){
  if(!pendingQuestions.length)previewCreate();
  if(!pendingQuestions.length)return;
  const title=document.getElementById("newTitle").value.trim()||`训练轮次：${fmtDate(now())}`;
  const r={id:uid("tr"),title,createdAt:now(),updatedAt:now(),submittedAt:null,status:"answering",questions:pendingQuestions};
  state.rounds.push(normalizeRound(r));save();
  document.getElementById("newTitle").value="";document.getElementById("newText").value="";document.getElementById("createPreview").innerHTML="";document.getElementById("createBtn").disabled=true;
  pendingQuestions=[];openRound(r.id);
}

function renderTypeGroups(){
  const box=document.getElementById("typeGroupBox");
  const groups={};
  state.rounds.forEach(r=>r.questions.forEach((q,i)=>{const k=q.type||"未分类";(groups[k]||(groups[k]=[])).push({q,r,i})}));
  const keys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  if(!keys.length){box.innerHTML='<div class="empty">暂无题型数据。</div>';return}
  box.innerHTML=`<div class="type-stat-grid">${keys.slice(0,6).map(k=>`<button class="card type-card" onclick="document.getElementById('type_${encodeURIComponent(k)}').scrollIntoView({behavior:'smooth'})"><b>${groups[k].length}</b><span>${esc(k)}</span></button>`).join("")}</div>`+
  keys.map(k=>{
    const arr=groups[k],done=arr.filter(x=>(x.q.userAnswer||"").trim()).length;
    return `<details class="type-detail card" id="type_${encodeURIComponent(k)}"><summary><div><h3>${esc(k)} · ${arr.length}题</h3><p class="small">已作答 ${done}/${arr.length}</p></div></summary><ul class="type-list">${arr.slice(0,12).map(x=>`<li onclick="currentRoundId='${esc(x.r.id)}';currentIndex=${x.i};showPage('detail')"><b>${esc(x.q.prompt)}</b><div class="small">${esc(x.r.title)}</div></li>`).join("")}</ul></details>`
  }).join("");
}

function renderGuide(){
  renderPending();
}
function renderPending(){
  const box=document.getElementById("guidePendingList");
  const arr=state.rounds.filter(r=>normalizeStatus(r.status)==="pending_ai");
  if(!arr.length){box.innerHTML='<div class="empty">暂无待 AI 二筛的训练轮次。</div>';return}
  box.innerHTML=arr.map(r=>`<div class="round-card" onclick="currentRoundId='${esc(r.id)}';showExport()"><div><h3>${esc(r.title)}</h3><div class="meta"><span>已作答 ${answeredCount(r)}/${r.questions.length}</span><span>${fmtDate(r.submittedAt||r.updatedAt)}</span></div><div class="small">ID：${esc(r.id)}</div></div></div>`).join("");
}
function buildHER1(r){
  const lines=["HER1","轮次|"+r.title,"ID|"+r.id,"状态|"+statusLabel(r.status),"字段|题号|题目|参考答案|类型|阶段|句型骨架|句型限制|备注|音标|Heron作答|Heron一筛|Heron自标错因|请求AI判断"];
  r.questions.forEach((q,i)=>lines.push([i+1,q.prompt,q.reference,q.type,q.stage,q.pattern,q.constraint,q.note,q.phonetic,q.userAnswer,q.selfCheck,(q.errorTags||[]).join(","),"yes"].map(x=>String(x??"").replace(/\n/g," ")).join("|")));
  return lines.join("\n");
}
function showExport(){
  saveCurrent();
  const r=getRound(currentRoundId);if(!r)return;
  showPage("exportPage");
  const text=buildHER1(r);
  document.getElementById("exportBox").innerHTML=`<div class="panel"><h2>导出给 AI 二筛</h2><p class="sub">${esc(r.title)}</p><div class="actions"><button class="primary" onclick="copyText(${JSON.stringify(text)})">复制 HER1</button><button class="ghost" onclick="downloadText('HER1_'+safeName('${esc(r.title)}')+'.txt',${JSON.stringify(text)})">下载 .txt</button></div><pre class="export-text card">${esc(text)}</pre></div>`;
}
function safeName(s){return String(s||"").replace(/[\\/:*?"<>|]/g,"_").slice(0,60)}
function copyText(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert("已复制。")).catch(()=>fallbackCopy(t))}
function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();alert("已复制。")}
function downloadText(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}

function backupJSON(){save();return JSON.stringify(state)}
function downloadJSON(){downloadText("heron-english-backup.json",backupJSON())}
function downloadHEB(){downloadText("heron-english-backup.heb",backupJSON())}
function copyBackupText(){copyText(backupJSON())}
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>importBackupString(String(r.result||""));r.readAsText(file)}
function importBackupText(){importBackupString(document.getElementById("backupText").value)}
function importBackupString(raw){
  raw=String(raw||"").trim();
  try{
    let obj;
    if(raw.startsWith("HEB1E/")){
      const body=raw.split(":").slice(1).join(":");
      obj=JSON.parse(decodeURIComponent(escape(atob(body))));
    }else obj=JSON.parse(raw);
    if(!obj||!Array.isArray(obj.rounds))throw new Error("备份格式错误");
    if(!confirm("导入会覆盖当前本地数据，确定继续？"))return;
    state=obj;normalizeState();save();alert("导入成功。");showPage("home");
  }catch(e){alert("导入失败："+e.message)}
}

load();
</script>
